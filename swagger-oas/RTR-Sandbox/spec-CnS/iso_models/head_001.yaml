    PreferredContactMethod1Code:
      type: string
      description: >-
        Preferred method used to reach the individual contact within an
        organisation.

        *`LETT`-Preferred method used to reach the contact is per letter.

        *`MAIL`-Preferred method used to reach the contact is per email.

        *`PHON`-Preferred method used to reach the contact is per phone.

        *`FAXX`-Preferred method used to reach the contact is per fax.

        *`CELL`-Preferred method used to reach the contact is per mobile or cell
        phone.
      enum:
        - LETT
        - MAIL
        - PHON
        - FAXX
        - CELL
    UnicodeChartsCode:
      type: string
      description: "codelist containing the names of the UNICODE code block name as specified on http://unicode.org/Public/UNIDATA/Blocks.txt."
    YesNoIndicator:
      type: boolean
      description: 'Indicates a "Yes" or "No" type of answer for an element.'
